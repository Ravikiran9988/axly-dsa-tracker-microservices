name: Axly Microservices CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Run a postgres instance for the unit tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: axly_user
          POSTGRES_PASSWORD: axly_password
          POSTGRES_DB: axly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Setup Environment
    - name: Bootstrap Database
      run: |
        chmod +x infrastructure/init-db.sh
        export POSTGRES_USER=axly_user
        export POSTGRES_PASSWORD=axly_password
        ./infrastructure/init-db.sh
      env:
        PGPASSWORD: axly_password

    # Shared Package
    - name: Build Shared Package
      working-directory: ./backend/packages/shared
      run: |
        npm install
        npm run build

    # Test Node Services
    - name: Test Auth Service
      working-directory: ./backend/services/auth-service
      run: |
        npm install
        npx prisma db push
        npm run test

    - name: Test Question Service
      working-directory: ./backend/services/question-service
      run: |
        npm install
        npx prisma db push
        npm run test

    - name: Test Submission Service
      working-directory: ./backend/services/submission-service
      run: |
        npm install
        npx prisma db push
        npm run test
        
    - name: Test Execution Service
      working-directory: ./backend/services/execution-service
      run: |
        npm install
        npm run test

    - name: Test Daily Challenge Service
      working-directory: ./backend/services/daily-challenge-service
      run: |
        npm install
        npx prisma db push
        npm run test

    - name: Test Progress Service
      working-directory: ./backend/services/progress-service
      run: |
        npm install
        npx prisma db push
        npm run test

    # Test Python Service
    - name: Test AI Service
      working-directory: ./backend/services/ai-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest

  e2e-validation:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Start Docker Compose
      working-directory: ./infrastructure
      run: docker-compose up -d --build

    - name: Wait for services
      run: sleep 30

    - name: Run E2E Tests
      working-directory: ./tests/e2e
      run: |
        npm install
        npm run test
