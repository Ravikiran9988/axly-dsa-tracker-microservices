version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: axly_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axly_password}
      POSTGRES_DB: ${POSTGRES_DB:-axly_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - axly_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axly_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: axly_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: axly_user
      RABBITMQ_DEFAULT_PASS: axly_password
    networks:
      - axly_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: axly_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - axly_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  axly_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
